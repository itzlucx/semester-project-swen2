services:
  db:
    image: postgres:16
    container_name: tourplanner-db
    environment:
      POSTGRES_DB: tourplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tourplanner-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/tourplanner
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: meinSuperGeheimerSchluesselDerMindestens32ZeichenLangSeinMuss
      FILE_UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tourplanner-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: