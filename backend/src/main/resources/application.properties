spring.application.name=TourPlannerBackend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tourplanner}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.at.technikum.tourplanner=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
jwt.secret=${JWT_SECRET:meinSuperGeheimerSchluesselDerMindestens32ZeichenLangSeinMuss}
jwt.expiration=86400000

