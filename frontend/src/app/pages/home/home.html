<div class="home-container">
  <div class="content-area">
    <mat-card class="tour-container">
      <mat-card-header>
        <h2>Touren</h2>
      </mat-card-header>
      <mat-card-content>
        <div class="search-bar">
          <mat-form-field appearance="outline">
            <mat-label>Touren durchsuchen...</mat-label>
            <input matInput [(ngModel)]="searchQuery" (input)="onSearch()" />
            @if (searchQuery) {
              <button matSuffix mat-icon-button (click)="onClear()">✕</button>
            }
          </mat-form-field>
        </div>
        <app-tour-list [tours]="state.tours()"></app-tour-list>
      </mat-card-content>
    </mat-card>
  </div>
</div>
