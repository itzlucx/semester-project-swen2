<div class="home-container">
  <div class="content-area">
    <mat-card class="tour-container">
      <mat-card-header>
        <h2>Touren</h2>
      </mat-card-header>
      <mat-card-content>
        <div class="search-bar">
          <mat-form-field appearance="outline">
            <mat-label>Touren durchsuchen...</mat-label>
            <input matInput [(ngModel)]="searchQuery" (input)="onSearch()" />
            @if (searchQuery) {
              <button matSuffix mat-icon-button (click)="onClear()">✕</button>
            }
          </mat-form-field>
        </div>
        <app-tour-list [tours]="state.tours()"></app-tour-list>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="backup-actions">
  <button mat-raised-button color="accent" (click)="onExport()">
    📥 Touren Exportieren (JSON)
  </button>

  <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" accept=".json">
  
  <button mat-raised-button color="primary" (click)="fileInput.click()">
    📤 Touren Importieren (JSON)
  </button>
</div>
</div>
